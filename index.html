<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Imagem com Menu</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
    }

    .container {
      position: relative;
      display: inline-block;
    }

    .container img {
      max-width: 100%;
      height: 60%;
      display: block;
    }

    .menu {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 5px;
    }

    .menu button {
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      border: none;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <div class="container">
    <img id="imagem" src="img/paisagem.png" alt="Imagem">

    <div class="menu">
      <button>Home</button>
      <button>Sobre</button>
      <button>Contato</button>
    </div>
  </div>

  <p id="largura"></p>

  <script>
    const img = document.getElementById("imagem");
    const larguraTexto = document.getElementById("largura");

  </script>

</body>

</html>
