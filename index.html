<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Imagem com Menu</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
    }

    .container {
      position: relative;
      display: inline-block;
    }

    .container img {
      max-width: 100%;
      height: 60%;
      display: block;
    }

    .menu {
      position: absolute;
      top: 10px;
      right: 10px;
    }

    .menu ul {
      display: flex;
      gap: 5px;
      list-style: none;
      
    }

    .menu a {
     
      padding: 5px 10px;
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
      background: white;
      color: rgb(0, 0, 0);
     
    }
  </style>
</head>

<body>

  <div class="container">
    <img id="imagem" src="img/paisagem.png" alt="Imagem">

    <nav class="menu">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Sobre</a></li>
        <li><a href="#">Contato</a></li>
      </ul>
    </nav>
  </div>

  <p id="largura"></p>

  <script>
    const img = document.getElementById("imagem");
    const larguraTexto = document.getElementById("largura");

  </script>

</body>

</html>
